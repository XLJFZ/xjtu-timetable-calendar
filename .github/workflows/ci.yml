name: CI

# 最小可用门禁：
#   1) test  —— 3.11/3.12/3.13 上跑 pytest + mypy strict + ruff check + ruff format --check
#   2) wheel —— 真正构建 wheel 并在**干净虚拟环境**里安装后自检，
#               确保 `pip install .` 得到的包是自包含的（含包内默认接口定义）
#
# 刻意不做的：
#   - 不做发布：发布（tag / Release）仍由人工执行
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q

      - name: mypy (strict)
        run: python -m mypy

      - name: ruff
        run: python -m ruff check .

      - name: ruff format (check only)
        run: python -m ruff format --check .

  wheel:
    name: wheel self-contained check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Wheel must contain the bundled endpoint config
        run: |
          python - <<'PY'
          import glob, zipfile

          wheels = sorted(glob.glob("dist/*.whl"))
          assert len(wheels) == 1, f"期望恰好一个 wheel，实际：{wheels}"
          names = zipfile.ZipFile(wheels[0]).namelist()

          target = "xjtu_calendar/data/ehall_endpoints.json"
          print(f"{wheels[0]} 内容：")
          for name in sorted(names):
              print("   ", name)
          assert target in names, f"wheel 缺少包内默认接口定义 {target}"
          print("OK:", target)
          PY

      - name: Install wheel into a clean venv and probe it
        # 关键点：这里**不能**用 `pip install .`（会连仓库源码目录一起带上），
        # 必须在只装 wheel 的干净环境里验证，否则“碰巧从源码目录找到配置文件”会假通过。
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/xjtu-calendar --version
          .venv-wheel/bin/python - <<'PY'
          import json, pathlib

          import xjtu_calendar
          from xjtu_calendar.fetcher import bundled_endpoints_text, load_endpoints

          pkg_dir = pathlib.Path(xjtu_calendar.__file__).parent
          print("imported from:", pkg_dir)
          assert "site-packages" in pkg_dir.parts, "必须从已安装的 wheel 导入，而不是仓库源码目录"
          print("version:", xjtu_calendar.__version__)

          text = bundled_endpoints_text()
          assert text, "包内默认接口定义读取失败"
          assert json.loads(text)["endpoints"], "包内接口定义为空"

          endpoints = load_endpoints()
          assert "timetable" in endpoints, f"干净环境里拿不到 timetable 端点：{sorted(endpoints)}"
          print("endpoints:", sorted(endpoints))
          print("OK: wheel self-contained")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: wheel
          path: dist/*.whl
