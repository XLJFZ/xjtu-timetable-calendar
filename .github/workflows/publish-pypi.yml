name: Publish to PyPI

# **手动触发**（workflow_dispatch）把 sdist + wheel 发布到 PyPI。
# 使用 OIDC trusted publishing：仓库里不存任何 token。
#
# 一次性配置（在 pypi.org 网页上，用你自己的 PyPI 账号登录后）：
#   右上角头像菜单 → Account → 左侧「Publishing」→
#   「Add a publisher」（PyPI 支持为**还不存在的新包**先登记待定发布者，
#    首次经 OIDC 上传时会自动创建该项目）：
#     Project name          : xjtu-timetable-calendar
#     Publisher type        : GitHub Actions
#     Repository owner      : XLJFZ
#     Repository name       : xjtu-timetable-calendar
#     Workflow name         : publish-pypi.yml
#     Environment           : （留空——本 workflow 不使用 GitHub environment）
# 登记完成后，在 Actions → Publish to PyPI → Run workflow 即可发布。
# 版本重复上传会被 PyPI 拒绝——这正是防误发的保险。

on:
  workflow_dispatch:
    inputs:
      repository_url:
        description: "留空 = 正式 PyPI；填 https://test.pypi.org/pypi/ 则发测试库"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event.inputs.repository_url || '' }}
          # 未配置 repository_url 时该键为空，action 会发往正式 PyPI。
          print-version-info: true
