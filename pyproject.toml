[build-system]
# setuptools>=77 才支持 PEP 639（license = "SPDX" 字符串 + license-files）。
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xjtu-timetable-calendar"
version = "0.6.0"
description = "将西安交通大学 eHall 个人课表导出为 iCalendar (.ics)"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639：SPDX 表达式 + license-files。使用 SPDX 表达式时**不得**再保留
# License 分类器（PEP 639 明确禁止两者并存）。
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "XJTU Timetable Calendar contributors" }]
keywords = ["xjtu", "timetable", "icalendar", "ics", "calendar", "课表"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]

# 运行期依赖尽量克制：
#   - icalendar  负责 RFC 5545 序列化（折行/转义规则复杂，不适合手写）
#   - httpx      可选，仅用于无浏览器环境下的 HTTP 会话复用；playwright 路径不需要
#   - playwright 仅 login 子命令需要，见 [project.optional-dependencies].browser
#
# 下限 = 6.1.0，起因是 RFC 5545 §3.2.19 要求「每个被引用的唯一 TZID 都要有
# 对应的 VTIMEZONE」，而 `Calendar.add_missing_timezones()` 是 6.1.0 才引入的
# （实测 5.0.0 / 5.0.14 / 6.0.0 均无该 API）。本项目不手写时区定义，
# 依赖这个官方实现来生成 Asia/Shanghai 的 VTIMEZONE。
# 暂不设上限：未观测到 6.1+ 主版本的不兼容行为，加 `<N` 只会无谓地限制用户。
dependencies = ["icalendar>=6.1.0"]

[project.optional-dependencies]
http = ["httpx>=0.27"]
browser = ["playwright>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "playwright>=1.40",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.scripts]
xjtu-calendar = "xjtu_calendar.cli:main"

[project.urls]
Homepage = "https://github.com/XLJFZ/xjtu-timetable-calendar"
Issues = "https://github.com/XLJFZ/xjtu-timetable-calendar/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# 包内默认接口定义（真实观测产物）。**必须**随 wheel 分发 ——
# 否则 `pip install .` 之后包不自包含，用户得手工复制配置才能首次使用。
# 只写在 pyproject 里不算数，必须实测 wheel 内确实含该 JSON（见测试与 CI）。
[tool.setuptools.package-data]
xjtu_calendar = ["data/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --doctest-modules"
filterwarnings = ["error::DeprecationWarning"]
doctest_optionflags = ["NORMALIZE_WHITESPACE"]

[tool.coverage.run]
source = ["src/xjtu_calendar"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501：行宽由 formatter 负责，不在 lint 里重复制造噪音。
#
# RUF001/002/003（ambiguous-unicode-character-*）针对的是「形似 ASCII 的非 ASCII 字符」
# 这类钓鱼式混淆，但它的字符表把中文全角标点（（）「」：、等）一并算了进去。
# 本仓库的 docstring、注释与面向用户的文案**本身就是中文**，全角标点是正确写法：
# 实测 1097 处命中（占全部 RUF 命中的 96%）均为误报。
# 结论：显式关闭这三条规则，而不是改写一千多处标点去迎合它。
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/xjtu_calendar"]
