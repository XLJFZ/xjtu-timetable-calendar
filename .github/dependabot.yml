version: 2
updates:
  # Python 依赖（requirements 由 pyproject 声明）
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tools:
        patterns:
          - "pytest*"
          - "mypy"
          - "ruff"
          - "httpx"
          - "playwright"
          - "pytest-cov"

  # GitHub Actions 自身（checkout/setup-python/upload-artifact/发布 action）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
