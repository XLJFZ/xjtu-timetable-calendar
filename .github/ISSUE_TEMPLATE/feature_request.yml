name: "功能建议 / Feature Request"
description: "想要的新能力或改进（考试安排导入、多学期管理……）"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题（不是实现方案）
      placeholder: 每学期换一次都要手工重配校历很麻烦……
    validations:
      required: true
  - type: textarea
    id: data-source
    attributes:
      label: 数据来源是官方公开的吗？（涉及学校数据的功能必填）
      description: |
        本项目红线：**不猜接口、不伪造学校数据**。如果功能涉及新的数据获取，
        请给出官方页面/接口链接，或说明打算用 scripts/probe_ehall.py 探测确认。
  - type: textarea
    id: idea
    attributes:
      label: 期望的用法（命令 / 参数长什么样）
